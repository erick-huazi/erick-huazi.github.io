<head>
  <meta charset="utf-8">

  <style>
    @font-face{font-family:"Smiley Sans";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/smiley-sans-subset.woff2) format("woff2")}
    :root{--hl:#ffe14a;--ink:#141414;--mute:#6a6a66;--line:rgba(20,20,20,.14);--display:"Smiley Sans","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#fbfbf9;color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
    .wrap{width:min(1100px,calc(100% - 80px));margin-inline:auto}
    header{padding:18px 0;border-bottom:1px solid var(--line)}
    .brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:700}
    .brand img{width:28px;height:28px}
    .brand em{font-style:normal;font-weight:400;color:var(--mute)}
    main{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(40px,7vw,96px);align-items:center;padding:clamp(56px,11vh,120px) 0 clamp(56px,9vh,96px)}
    .eyebrow,.routes h2{display:flex;align-items:center;gap:10px;margin:0;font:400 19px/1.3 var(--display);letter-spacing:.02em}
    .eyebrow::before,.routes h2::before{content:"";width:22px;height:9px;background:var(--hl);transform:skewX(-14deg)}
    .number{display:inline-block;margin:.12em 0 .1em;padding-inline:.06em;font:400 clamp(120px,19vw,250px)/1 var(--display);background:linear-gradient(transparent 14%,var(--hl) 14%,var(--hl) 90%,transparent 90%);transform:rotate(-2deg)}
    h1{margin:0 0 16px;font:400 clamp(30px,4.2vw,52px)/1.2 var(--display)}
    .intro{margin:0;max-width:27em;font-size:16px;line-height:1.9;color:var(--mute)}
    .routes h2{padding-bottom:16px;border-bottom:1px solid var(--ink)}
    .routes a{display:grid;grid-template-columns:30px 1fr 22px;align-items:center;gap:14px;padding:22px 10px;border-bottom:1px solid var(--line);position:relative;isolation:isolate}
    .routes a::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--hl);transform:scaleY(0);transform-origin:bottom;transition:transform .5s cubic-bezier(.16,1,.3,1)}
    .routes .index{font-size:13px;font-weight:600;color:var(--mute)}
    .routes strong{display:block;font:400 26px/1.3 var(--display)}
    .routes small{display:block;margin-top:2px;font-size:13px;line-height:1.7;color:var(--mute)}
    .arrow{font-size:22px;transition:transform .4s cubic-bezier(.16,1,.3,1)}
    footer{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:20px 0 30px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
    footer a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);border-bottom:1px solid currentColor;min-height:0;padding-bottom:2px}
    @media(hover:hover){.routes a:hover::before{transform:scaleY(1)}.routes a:hover .index,.routes a:hover small{color:var(--ink)}.routes a:hover .arrow{transform:translate(4px,-4px)}}
    @media(max-width:720px){.wrap{width:calc(100% - 40px)}main{grid-template-columns:1fr;gap:44px;padding:40px 0 52px}.number{font-size:128px}.routes a{padding:18px 6px}.routes strong{font-size:22px}}
    @media(prefers-reduced-motion:reduce){.arrow,.routes a::before{transition:none}}
  </style>
</head>
