<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">World Cup project illustration</title>
  <desc id="desc">An abstract football pitch and match analysis drawing, with no real scores or predictions.</desc>
